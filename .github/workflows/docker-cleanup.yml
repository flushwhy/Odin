name: Clean up stale Docker Hub images

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report stale tags; do not delete them"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-hub-image-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) || (github.event_name != 'workflow_dispatch' && vars.DOCKER_CLEANUP_DRY_RUN != 'false') }}
      RETENTION_DAYS: "60"

    steps:
      - name: Clean up unused tags
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          username = os.environ["DOCKER_HUB_USERNAME"]
          password = os.environ["DOCKER_HUB_ACCESS_TOKEN"]
          dry_run = os.environ["DRY_RUN"].lower() == "true"
          cutoff = datetime.now(timezone.utc) - timedelta(days=int(os.environ["RETENTION_DAYS"]))
          base = "https://hub.docker.com"
          namespace, repository = "flushy", "odin"
          protected = {"latest", "nightly"}

          def request(url, method="GET", payload=None, token=None):
              data = json.dumps(payload).encode() if payload is not None else None
              headers = {"Accept": "application/json"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              if token:
                  headers["Authorization"] = f"JWT {token}"
              req = Request(url, data=data, headers=headers, method=method)
              with urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          auth = request(f"{base}/v2/users/login/", method="POST",
                         payload={"username": username, "password": password})
          token = auth["token"]
          next_url = f"{base}/v2/repositories/{namespace}/{repository}/tags?page_size=100"
          candidates = []
          protected_count = recent_count = unknown_count = 0

          while next_url:
              page = request(next_url, token=token)
              for tag in page.get("results", []):
                  name = tag["name"]
                  if name in protected:
                      protected_count += 1
                      continue

                  # A null pull timestamp means never pulled; age it from its last push.
                  pulled = tag.get("tag_last_pulled")
                  timestamp = pulled or tag.get("tag_last_pushed") or tag.get("last_updated")
                  if not timestamp:
                      unknown_count += 1
                      print(f"SKIP {name}: no usable activity timestamp")
                      continue
                  activity = datetime.fromisoformat(timestamp.replace("Z", "+00:00"))
                  if activity < cutoff:
                      candidates.append(name)
                  else:
                      recent_count += 1
              next_url = page.get("next")

          print(f"Scanned tags. Stale: {len(candidates)} | Recent: {recent_count} | Protected aliases: {protected_count} | Unknown timestamps: {unknown_count}")
          print(f"Retention: {os.environ['RETENTION_DAYS']} days. Version tags are included; only latest/nightly are protected.")
          for name in candidates:
              if dry_run:
                  print(f"DRY RUN: would delete {name}")
                  continue
              url = f"{base}/v2/repositories/{namespace}/{repository}/tags/{quote(name, safe='')}/"
              request(url, method="DELETE", token=token)
              print(f"DELETED {name}")

          if dry_run:
              print("Dry run only. Set repository variable DOCKER_CLEANUP_DRY_RUN=false to enable scheduled deletion.")
          PY
