name: Build and Push Odin Container

on:
  schedule:
    - cron: '0 2 * * *' # Runs every night at 2:00 AM UTC (Nightly build)
  push:
    branches: [ "main" ] # Triggers if you update your own repo configuration/Dockerfile
  workflow_dispatch:
    inputs:
      odin_version:
        description: 'Odin version tag or branch to build (e.g., master, dev-2026-06)'
        required: true
        default: 'master'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Odin Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "odin_version=${{ github.event.inputs.odin_version }}" >> $GITHUB_OUTPUT
          else
            echo "odin_version=master" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            YOUR_DOCKERHUB_USERNAME/odin
            ghcr.io/${{ github.repository_owner }}/odin
          tags: |
            # If building master, tag it as 'nightly' and 'latest'
            type=raw,value=nightly,enable=${{ steps.version.outputs.odin_version == 'master' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.odin_version == 'master' }}
            # If building a specific release tag via workflow_dispatch, use that exact version tag
            type=raw,value=${{ steps.version.outputs.odin_version }},enable=${{ steps.version.outputs.odin_version != 'master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64 # Multi-architecture support for Apple Silicon & x86 servers
          build-args: |
            ODIN_VERSION=${{ steps.version.outputs.odin_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}