name: Build and Push Odin Docker Image

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      odin_version:
        description: "Odin branch, tag, or commit to build"
        required: true
        default: "master"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Odin Version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ODIN_VERSION: ${{ inputs.odin_version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'odin_version=%s\n' "$INPUT_ODIN_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "odin_version=master" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            flushy/odin
            ghcr.io/flushwhy/odin
          flavor: |
            latest=false
          tags: |
            type=raw,value=nightly,enable=${{ steps.version.outputs.odin_version == 'master' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.odin_version == 'master' }}
            type=raw,value=${{ steps.version.outputs.odin_version }},enable=${{ steps.version.outputs.odin_version != 'master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            ODIN_VERSION=${{ steps.version.outputs.odin_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && steps.version.outputs.odin_version == 'master') }}
